# Runs the forced-red drill sweep, cli/drills.mjs, weekly and on every pull request.

name: drills

on:
  schedule:
    # GitHub delays scheduled runs and disables them after 60 days without activity; a missed run is silent.
    - cron: "0 6 * * 4"
  workflow_dispatch:
  # No `paths:` filter: only cli/drills.mjs knows which files a drill perturbs.
  pull_request:

permissions:
  contents: read

concurrency:
  group: drills-${{ github.ref }}
  cancel-in-progress: false

jobs:
  forced-red:
    runs-on: ubuntu-latest
    if: github.repository == 'sleepy-panda-srl/portulan'
    steps:
      # Full history: the pack-version and pack-identity rails it drills cannot run in a shallow clone.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Force every rail red and require it to fire
        shell: bash
        run: |
          set -uo pipefail
          # GitHub's `shell: bash` sets -e: without +e a red sweep aborts the step before rc is read.
          set +e

          # Captured, not piped: a status read through a pipe is the pipe's.
          out="$RUNNER_TEMP/drills.txt"
          node cli/drills.mjs --pack-root packs >"$out" 2>&1
          rc=$?
          cat "$out"
          {
            printf '### The forced-red drill sweep\n\n```\n'
            cat "$out"
            printf '```\n'
          } >>"$GITHUB_STEP_SUMMARY"

          case "$rc" in
            0)
              printf '::notice::every drilled rail was forced red and fired\n'
              ;;
            1)
              printf '::error::a rail did not fire when it was forced red. It has stopped being a rail — read the transcript above\n'
              exit 1
              ;;
            2)
              printf '::error::the sweep could not judge every rail. A set that was not fully judged has not been judged — this is a failure to look, not a finding\n'
              exit 2
              ;;
            *)
              printf '::error::the sweep exited %s, which is not a verdict it documents — refusing to translate it into one\n' "$rc"
              exit 2
              ;;
          esac
