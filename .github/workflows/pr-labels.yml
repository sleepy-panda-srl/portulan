# Every pull request carries a label from the set .portulan/labels.json declares.

name: pr labels

on:
  pull_request:
    # `labeled` and `unlabeled` re-run the check once a label is added; without them only a push clears a red.
    types: [opened, reopened, ready_for_review, synchronize, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  # This id is a required status-check context (a `name:` would replace it): renaming it blocks every pull request.
  pr-labeled:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: The pull request carries at least one declared label
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail

          POLICY=.portulan/labels.json

          if [ ! -f "$POLICY" ]; then
            printf '::error::%s is missing — cannot judge whether this pull request is labelled\n' "$POLICY"
            exit 1
          fi
          if ! declared=$(jq -er '.labels[].name' "$POLICY"); then
            printf '::error::%s declares no labels, or does not parse — refusing to report green\n' "$POLICY"
            exit 1
          fi

          # From the API, not the event payload: `gh pr create --label` applies labels after `opened` fires.
          if ! carried=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.labels[]?.name'); then
            printf '::error::could not read the labels on #%s — refusing to report green on an unread pull request\n' "$PR_NUMBER"
            exit 1
          fi

          matched=$(comm -12 <(printf '%s\n' "$declared" | sort -u) <(printf '%s\n' "$carried" | sort -u))

          {
            printf '### Declared labels\n\n'
            jq -r '.labels[] | "- `\(.name)` — \(.description)" + (if (.covers|length) > 0 then " _(usually: \(.covers|join(", ")))_" else "" end)' "$POLICY"
            printf '\n### On this pull request\n\n%s\n' "$(printf '%s' "${carried:-none}" | sed 's/^/- /')"
          } >>"$GITHUB_STEP_SUMMARY"

          if [ -z "$matched" ]; then
            printf '::error::this pull request carries no label from the declared set — add one of: %s\n' \
              "$(printf '%s' "$declared" | tr '\n' ' ')"
            printf 'RED — unlabelled. Declared labels:\n%s\n' "$declared"
            exit 1
          fi

          printf 'GREEN — carries: %s\n' "$(printf '%s' "$matched" | tr '\n' ' ')"
