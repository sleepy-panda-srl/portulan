# Publish the package to GitHub Packages, under the name that registry forces.

name: publish-github-packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: The tag to publish (for example v0.1.1)
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-github-packages-${{ github.event.release.tag_name || github.event.inputs.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.ref }}
          persist-credentials: false

      # Tags before v0.1.3 carry no cli/release-eval.mjs, so the grader comes from the default branch.
      - name: Check out the grader from the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .release-eval-grader
          persist-credentials: false

      # Must run before the publish: a refusal after it would leave the release already shipped.
      - name: The tagged tree carries its own eval result
        run: |
          set -euo pipefail
          # The tag, never package.json's version, which an uncut tree leaves at the previous release.
          node .release-eval-grader/cli/release-eval.mjs \
            --tagged "${{ github.event.release.tag_name || github.event.inputs.ref }}" \
            --repo-root .

      - name: Remove the grader before anything is packed
        run: rm -rf .release-eval-grader

      - name: Publish under the owner-scoped name GitHub Packages requires
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          SCOPE='@sleepy-panda-srl'
          TARGET="$SCOPE/portulan"

          node -e '
            const fs = require("fs");
            const target = process.argv[1];
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const was = pkg.name;
            pkg.name = target;
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
            const now = JSON.parse(fs.readFileSync("package.json", "utf8")).name;
            if (now !== target) { console.error(`rewrite did not take: ${now}`); process.exit(1); }
            console.log(`name: ${was} -> ${now} (version ${pkg.version})`);
          ' "$TARGET"

          VERSION="$(node -p 'require("./package.json").version')"

          # Single-quoted so npm, not the shell, expands `${NODE_AUTH_TOKEN}`: the token never reaches disk.
          printf '%s:registry=https://npm.pkg.github.com\n' "$SCOPE" > .npmrc
          printf '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}\n' >> .npmrc

          already_published=no
          if npm view "$TARGET@$VERSION" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "$TARGET@$VERSION is already on GitHub Packages — nothing to publish."
            already_published=yes
          fi

          # Visibility here is a per-package setting made by hand, not `--access public`, which npmjs needs.
          if [ "$already_published" = "no" ]; then
            npm publish --access public --registry=https://npm.pkg.github.com
            echo "published $TARGET@$VERSION to GitHub Packages"
          fi

          # Parsed with node, not `--jq`: a jq program here would owe fixtures to the workflow-filters recipe.
          if gh api "/orgs/sleepy-panda-srl/packages/npm/portulan" > package-visibility.json 2>/dev/null; then
            node -e 'const p=require("./package-visibility.json"); console.log("visibility:", p.visibility)'
          else
            echo "visibility: could not be read — check the Packages page by hand"
          fi
          rm -f package-visibility.json
