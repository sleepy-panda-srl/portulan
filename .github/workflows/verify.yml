# The workspace verify recipes, run by CI as the required `workspace-verify` check.

name: workspace verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # This id is a required status-check context (a `name:` would replace it): renaming it blocks every pull request.
  workspace-verify:
    runs-on: ubuntu-latest
    # No setup or install step: every tool the recipes need is preinstalled on the runner.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The pack-version recipe needs the merge-base; in a shallow clone it exits 2, failing this check.
          fetch-depth: 0

      - name: Run every verify recipe the workspace manifest yields
        run: |
          set -uo pipefail
          set +e   # GitHub's default shell is `bash -e`; a red recipe must not abort the loop

          err=$(mktemp)
          recipes=$(node cli/recipe-set.mjs --workspace .portulan --repo-root . --pack-root packs 2>"$err")
          rc=$?
          if [ "$rc" -ne 0 ]; then
            printf '::error::verify recipes unusable: %s\n' "$(tr '\n' ' ' <"$err" | sed 's/  */ /g' | cut -c1-400)"
            cat "$err" >&2
            exit 2
          fi

          if [ -z "$recipes" ]; then
            printf '::error::the manifest declares no verify recipes — refusing to report green\n'
            exit 2
          fi

          status=0
          while IFS=$'\t' read -r id cmd; do
            if [ -z "$id" ] || [ -z "$cmd" ]; then
              printf '::error::malformed recipe line from the manifest — refusing to report a partial run\n'
              exit 2
            fi
            printf '::group::%s — %s\n' "$id" "$cmd"
            # stdin is /dev/null so a recipe that reads it cannot swallow the rest of this list.
            bash -c "$cmd" </dev/null
            rc=$?
            printf '::endgroup::\n'
            if [ "$rc" -ne 0 ]; then
              printf '::error::verify recipe %s exited %s\n' "$id" "$rc"
              status=1
            fi
          done <<<"$recipes"

          exit "$status"
