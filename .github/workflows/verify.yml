# The workspace verify recipes, run by the platform rather than by whoever remembers to.
#
# This is what makes them eligible to be a *required status check* on `main`
# (.portulan/proposals/0001-platform-floor-on-main.md): branch protection can only require a
# check that CI actually reports. Without it, "required status checks" has nothing to require
# and the floor rests on review alone.
#
# The recipes are NOT listed here. They are read from `.portulan/workspace.json`, so adding a
# recipe to the manifest makes it enforced — no workflow edit, and no branch-protection change
# that somebody has to remember. See .portulan/proposals/0004-ci-runs-every-declared-recipe.md.
#
# One job, one context, and the name says what it asserts. It arrived that way by a sequence
# rather than an edit: a required context cannot be renamed in a pull request, because the old
# context stops reporting and `enforce_admins` means the resulting block cannot be forced past.
# So the new job ran alongside the old, protection was re-pointed by hand, and only then was the
# transitional job deleted — proposal 0004, completed 2026-07-25.
#
# Deliberately no matrix and no cache: the recipes need bash, git, POSIX text utilities, and
# node — all preinstalled on the runner. Note there is no actions/setup-node step, and that is
# the point: adding one would pin a version, which would make this workflow a build. A verify
# recipe with a build step of its own is a verify recipe that starts failing for reasons
# unrelated to the change under test.

name: workspace verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # A job's NAME is the status-check context branch protection pins, and the name defaults to the
  # job id when no `name:` is given — which is why this job sets none. Verified against the live
  # repository rather than assumed: the required context is the bare string `workspace-verify`,
  # pinned to app 15368 (GitHub Actions). The `workflow / job` form seen in some UI listings is a
  # display convention, not the context string.
  #
  # Renaming this id silently detaches the required-check rule that references it. If it ever has
  # to change, repeat 0004's sequence — run the new name alongside, move protection, then delete —
  # rather than editing the id in place.
  workspace-verify:
    runs-on: ubuntu-latest
    steps:
      # Pinned to a full-length commit SHA. This organisation's Actions policy requires it, and
      # the policy is right: a movable tag is a supply-chain hole, because whoever controls `v7`
      # can repoint it at any commit and every workflow trusting the tag picks it up silently.
      # SHA below is actions/checkout v7.0.1.
      #
      # Moved off v4.4.0 because that release declares `using: node20` and the runner has been
      # forcing it onto Node 24 since the Node 20 deprecation, which is a warning today and a
      # broken required check on the day the runner stops carrying the old runtime. v5.0.0 is the
      # first release declaring `using: node24`; v7 is taken rather than the smallest bump so the
      # pin sits on the line that keeps getting fixes. What that jump changes for *this* job is
      # nothing: v6 moved persisted credentials into `$RUNNER_TEMP` (needs runner >= v2.329.0,
      # which GitHub-hosted `ubuntu-latest` is well past) and every recipe here touches git only
      # through `git ls-files` — local, no network, no credentials.
      #
      # One caveat, load-bearing only if this step ever grows a `with:`. Since v5.1.0 checkout
      # refuses to check out a fork pull request under `pull_request_target` or `workflow_run`
      # unless `allow-unsafe-pr-checkout` is set. The guard is skipped entirely for a default
      # self-checkout — no `repository:` and no `ref:` — which is what this step is, and this
      # workflow triggers on `pull_request` besides. Adding a `ref:` here would arm it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run every verify recipe the workspace manifest declares
        run: |
          set -uo pipefail
          set +e   # GitHub's default shell is `bash -e`; a red recipe must not abort the loop

          # The emitter validates before it emits. A recipe that is declared but cannot be run —
          # an empty or whitespace-only command, a newline smuggled into one, an id that is not a
          # slug — must never be silently skipped, because "declared" is what this gate treats as
          # "enforced". Throwing here exits non-zero and becomes exit 2 below.
          err=$(mktemp)
          recipes=$(node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync(".portulan/workspace.json", "utf8"));
            // Exits cleanly rather than throwing: a stack trace is not a diagnosis, and this
            // message becomes the check-summary annotation that somebody reads first.
            const bail = (m) => { process.stderr.write(m + "\n"); process.exit(1); };
            const slug = /^[a-z0-9]+(-[a-z0-9]+)*$/;
            for (const r of m.verify.recipes) {
              const id = String(r.id ?? "");
              const run = String(r.run ?? "");
              if (!slug.test(id)) bail("recipe id is not a slug: " + JSON.stringify(r.id));
              if (!run.trim()) bail("recipe \"" + id + "\" declares an empty run command");
              if (/[\n\r\t]/.test(run)) bail("recipe \"" + id + "\" run contains a newline or tab");
              process.stdout.write(id + "\t" + run + "\n");
            }
          ' 2>"$err")
          rc=$?
          if [ "$rc" -ne 0 ]; then
            # The annotation carries the emitter's own message rather than a generic one. A manifest that
            # parses but declares an unrunnable recipe is NOT unreadable, and saying so sends whoever reads
            # the check summary to the wrong file — the failure is in a value, not in the JSON.
            printf '::error::verify recipes unusable: %s\n' "$(tr '\n' ' ' <"$err" | sed 's/  */ /g' | cut -c1-400)"
            cat "$err" >&2
            exit 2
          fi

          # Reporting green having run nothing is the failure this whole gate exists to prevent.
          # Enumerating the recipes is a precondition, exactly as enumerating the tree is inside
          # each recipe — see .portulan/memory/verify-preconditions-fail-closed.md.
          if [ -z "$recipes" ]; then
            printf '::error::the manifest declares no verify recipes — refusing to report green\n'
            exit 2
          fi

          status=0
          while IFS=$'\t' read -r id cmd; do
            # Belt and braces behind the emitter's validation. A `continue` here would be the
            # same fail-open in miniature: a line the loop cannot parse is work that was declared
            # and silently not done, so it stops the run rather than being skipped.
            if [ -z "$id" ] || [ -z "$cmd" ]; then
              printf '::error::malformed recipe line from the manifest — refusing to report a partial run\n'
              exit 2
            fi
            printf '::group::%s — %s\n' "$id" "$cmd"
            # stdin is /dev/null so a recipe that reads it cannot swallow the rest of this list.
            bash -c "$cmd" </dev/null
            rc=$?
            printf '::endgroup::\n'
            if [ "$rc" -ne 0 ]; then
              printf '::error::verify recipe %s exited %s\n' "$id" "$rc"
              status=1
            fi
          done <<<"$recipes"

          exit "$status"
