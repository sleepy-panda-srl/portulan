# A pull request a bot opens gets its Copilot review requested in the name of a person GitHub can bill.
#
# The policy is `.portulan/gate-map.md` → *Which identity acts* and *Merge discipline*; this file is
# only the actuator, and `copilot-review.yml` stays the checker that awaits the round it asks for.
#
# ## Why the ruleset is not enough
#
# Ruleset `copilot auto-review on pull requests` requests Copilot on a pull request a person opens, and
# on every push to it. On a pull request a GitHub App opens (`claude[bot]` from a cloud session,
# `portulan-agent[bot]` from the scheduled librarian) it does not, and what GitHub documents points at
# who pays. *About GitHub Copilot code review*, read 2026-09-23, under "Code review usage":
#
# > For pull requests authored by other bots, or when a bot requests the review, usage is billed
# > directly to the organization.
#
# The same page names the organisation's *AI credits paid usage* policy as what allows a charge for
# code review. Nothing here is paying the organisation's share, and whether that is because the
# organisation has no Copilot plan or because the policy is off cannot be read from this repository.
# The timelines fit it, read 2026-09-23. On the six App-authored pull requests read, every
# Copilot round was started "on behalf of" the maintainer after a request made in his name (#86, #157,
# #415, #429, #430), and #421, which had no such request, drew no round. Neither #415, #429 nor #430
# carries the "requested due to automatic review settings" event that the person-authored #418 carries
# on every push.
#
# The re-request in `copilot-review.yml` does not fill the gap: it is made with `GITHUB_TOKEN`, which is
# `github-actions[bot]`, so it is a bot's request as well. That fits the *requested, accepted, and gone*
# signature issue #161 records on #157 and #248, and explains no more of that issue than its re-requests.
#
# ## What this does instead
#
# It asks the way he does, with a token of the maintainer's, and the page quoted above attributes a
# review "manually requested by another user" to that user. It replaces his click and does not change
# who pays. The route that needs no token is the organisation paying, through that policy, which is his
# decision; if it is ever taken, this file becomes a second request for the same round and should be
# removed.
#
# **Measured on #435, 2026-09-23, the first bot-authored pull request after this file merged.** The
# request this job made at 15:49:59 is on the timeline as the maintainer's, Copilot's run for that head
# started at 15:50:09, and its review landed at 15:54:21. The route works. The job went red anyway,
# because it judged the request by GitHub's answer to it, and that answer could not have shown it.
#
# ## Why GraphQL, and why its answer is the proof
#
# The first cut asked over REST, `POST /pulls/{n}/requested_reviewers` naming
# `copilot-pull-request-reviewer[bot]`, which *Using GitHub Copilot code review* documents, and went red
# unless the pull request in GitHub's answer listed Copilot among its `requested_reviewers`. That list
# never names a Bot. On #435 it was empty after a request the timeline recorded; the maintainer's earlier
# script in another repository had measured the same, REST reporting no reviewers while GraphQL showed
# Copilot requested; and the field reports cited in this change's handoff say it too. A check keyed on
# that list was red by construction, which is the #286 failure turned inside out: there a success
# claimed a request that did not exist, and here a failure denied one that did.
#
# So the request is the GraphQL mutation `requestReviews`, with Copilot's Bot node id in `botIds` and
# `union: true`, so a reviewer already on the pull request is kept, and it selects the pull request's
# `reviewRequests` in its own answer. That answer is the state after the mutation, it does list a Bot,
# and reading it is not a second look that could race Copilot taking the request up. The design is the
# earlier script's, reused. The node id is looked up at run time from the REST login rather than written
# here, so the platform facts this file hard-codes stay the logins below.
#
# ## One round on the newest head, and never a request over a round in flight
#
# A request names no commit; Copilot reviews the head it finds. On #435 a push at 15:52 had this job ask
# while Copilot still held the 15:49 request, and nothing was recorded: the held request was answered on
# the earlier head at 15:54:21, and the newer head drew no round. So before asking, the job reads the
# pull request. A Copilot round already on the head means nothing is owed, and it stops. Copilot holding
# a request means a round is running or on order, and it waits, looking every 15 seconds for up to 15
# minutes. Only when neither holds does it ask, at most once per run.
#
# One job per pull request runs at a time. A newer push waits behind the running job rather than
# cancelling it, so a request is never cut off between the call and the reading of its answer; a third
# push cancels the second's pending run, which shows as cancelled and costs nothing, because the job
# that runs next asks for the head it then finds, or finds the round already on it.
#
# Only a pull request a bot opened, from this repository, and not a draft. A person's pull request is
# the ruleset's, billed to its author. A fork's is not this repository's to spend his allowance on.
# Drafts mirror the ruleset's `review_draft_pull_requests: false`, and `ready_for_review` asks when a
# draft stops being one; a pull request that becomes a draft during the wait is not asked for either.
# `synchronize` mirrors its `review_on_push: true`, because `copilot-reviewed` awaits a round on every
# head.
#
# ## Why `pull_request_target`, and why the token sits in an environment
#
# The token is the maintainer's, and *Pull requests: write*, the smallest permission that can request a
# reviewer, also lets it submit reviews as him, approvals included. So nothing a pull request contains
# may reach it. `pull_request_target` runs the base branch's copy of this file, so a pull request cannot
# change what runs with the token, and this job checks nothing out and runs no code from the pull
# request. The token is a secret of environment `copilot-request`, whose deployment branches the
# maintainer limits to `main`. GitHub sends no job that names an environment to a runner until that
# environment's rules pass, so a workflow pushed on any other branch cannot read the token either. This
# file cannot check the limit; it is part of his one-time setup. `permissions: {}`, because
# `GITHUB_TOKEN` is not used at all.
#
# The price of `pull_request_target` is that the pull request changing this file cannot exercise it: the
# copy that runs is the one on `main`.
#
# ## Observation procedure (proposal 0007)
#
# The REST cut's procedure ran on #435 and is recorded above. This cut's runs on the next bot-authored
# pull request after it merges: this job's log shows GitHub's answer to the mutation listing Copilot,
# the timeline shows "<maintainer> requested a review from Copilot" at the job's time, and a Copilot run
# for that head starts. That the token's *Pull requests: read and write* is enough for the mutation is
# the one thing it establishes for the first time, since the earlier script measured the mutation with
# `GITHUB_TOKEN`. On a push made while a round is running, the log shows the wait, and the timeline
# shows the request after the running round's review.
#
# ## What is red, and what is a warning
#
# Red is a fault that needs the maintainer: no token, a token GitHub refuses at the read (401, bad
# credentials, resource not accessible), a lookup or a request GitHub refuses, an answer that cannot be
# read, and an answer that does not list Copilot, which is a request GitHub did not record. A rename of
# the reviewer's login shows there too, with the logins printed. A request this job could not make,
# because the API stayed unreadable or Copilot still held a request when the wait ran out, is a warning
# and exit 0: nothing is broken that a re-run of this job does not repair, and the warning says so. What
# this job cannot see is a request GitHub records and Copilot then drops; only `copilot-reviewed` notices
# that, when no round arrives.

name: copilot request

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]

permissions: {}

jobs:
  copilot-requested:
    if: >-
      github.event.pull_request.user.type == 'Bot' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # Above the 15-minute wait below, so the wait's own warning ends the run and a job timeout never does.
    timeout-minutes: 20
    environment: copilot-request
    concurrency:
      group: copilot-request-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - name: Copilot is requested on a pull request a bot opened
        env:
          GH_TOKEN: ${{ secrets.COPILOT_REQUEST_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -uo pipefail
          # No globbing: the reviewer login contains `[bot]`, which an unquoted expansion would read
          # as a character class.
          set -f

          REVIEWER='copilot-pull-request-reviewer[bot]'
          # The logins that count as Copilot, lower-cased. REST names the reviewer with the `[bot]`
          # suffix and has shown it as `Copilot` (#86); GraphQL's `Bot.login`, which the mutation's
          # answer and the reads below carry, drops the suffix. The REST spellings are a second
          # carrier of `REVIEWERS` in `copilot-review.yml`, which this job cannot read because it
          # checks nothing out; the GraphQL one is this file's alone while that file reads REST. A
          # rename reds this job with the logins printed, the failure direction that file prefers.
          COPILOT_LOGINS='copilot-pull-request-reviewer[bot] copilot-pull-request-reviewer copilot copilot[bot]'
          POLL_SECONDS=15
          WAIT_SECONDS=900

          # Everything this job concludes goes to the job summary as well as the log, because a log
          # line alone is the notification nobody reads (proposal 0006).
          report() {
            printf '%s\n' "$@"
            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              printf '%s\n' "$@" >>"$GITHUB_STEP_SUMMARY"
            fi
          }

          # Prints the first login in $1 that counts as Copilot, and fails when none does.
          copilot_in() {
            local login lower candidate
            for login in $1; do
              lower=$(printf '%s' "$login" | tr '[:upper:]' '[:lower:]')
              for candidate in $COPILOT_LOGINS; do
                if [ "$lower" = "$candidate" ]; then
                  printf '%s' "$login"
                  return 0
                fi
              done
            done
            return 1
          }

          if [ -z "${GH_TOKEN:-}" ]; then
            printf '::error::no token to request Copilot with on #%s — COPILOT_REQUEST_TOKEN is empty in environment copilot-request\n' "$PR_NUMBER"
            report "Copilot was NOT requested on #${PR_NUMBER}, opened by ${PR_AUTHOR}." \
              "" \
              "The repair is the maintainer's: a fine-grained token of his, scoped to this repository with" \
              "Pull requests read and write, stored as secret COPILOT_REQUEST_TOKEN in environment" \
              "copilot-request, whose deployment branches are limited to main. Until then, request" \
              "Copilot from the Reviewers menu, which is what this job does in his name."
            exit 1
          fi

          owner=${GITHUB_REPOSITORY%%/*}
          repo=${GITHUB_REPOSITORY#*/}

          # One read per look, printed as three lines: the pull request's node id, head, state and
          # draft flag; the logins holding a review request; and the logins that reviewed the head.
          # A missing pull request prints an empty id and head, which the loop reads as unreadable.
          STATE_QUERY='query($owner: String!, $repo: String!, $number: Int!) {
            repository(owner: $owner, name: $repo) {
              pullRequest(number: $number) {
                id headRefOid state isDraft
                reviewRequests(first: 100) { nodes { requestedReviewer { ... on Bot { login } ... on User { login } } } }
                reviews(last: 100) { nodes { author { login } commit { oid } } }
              }
            }
          }'
          MUTATION='mutation($pullRequestId: ID!, $botId: ID!) {
            requestReviews(input: {pullRequestId: $pullRequestId, botIds: [$botId], union: true}) {
              pullRequest { reviewRequests(first: 100) { nodes { requestedReviewer { ... on Bot { login } ... on User { login } } } } }
            }
          }'

          err_file=$(mktemp)
          started=$(date +%s)
          looks=0
          unread=0
          last_error=''
          while :; do
            looks=$((looks + 1))
            pr_id=''
            head=''
            pr_state=''
            draft=''
            pending=''
            reviewed=''
            if state=$(gh api graphql -f query="$STATE_QUERY" -f owner="$owner" -f repo="$repo" -F number="$PR_NUMBER" \
                  --jq '.data.repository.pullRequest | ([.id, .headRefOid, .state, (.isDraft | tostring)] | join("|")), ([.reviewRequests.nodes[]?.requestedReviewer.login // empty] | join(" ")), (.headRefOid as $head | [.reviews.nodes[]? | select(.commit.oid == $head) | .author.login // empty] | join(" "))' \
                  2>"$err_file"); then
              # `$(...)` strips trailing newlines, so an empty last line, or two, never arrives; a
              # `read` that meets the end sets its variable empty and must not end the step.
              {
                IFS='|' read -r pr_id head pr_state draft || true
                IFS= read -r pending || true
                IFS= read -r reviewed || true
              } <<<"$state"
            else
              last_error=$(cat "$err_file")
              # A token GitHub rejects is not a slow API, and waiting fifteen minutes on it would only
              # hide the repair: red at once, as a refused request is.
              case "$last_error" in
                *'HTTP 401'*|*'Bad credentials'*|*'Resource not accessible'*)
                  printf '::error::GitHub refused to show #%s to the token\n' "$PR_NUMBER"
                  printf '%s\n' "$last_error"
                  report "Copilot was NOT requested on #${PR_NUMBER}, opened by ${PR_AUTHOR}: GitHub refused to show the pull request to the token." \
                    "" \
                    '```' "$last_error" '```' \
                    "" \
                    "An expired or revoked token, or one without Pull requests read on this repository, fails" \
                    "here. Request Copilot from the Reviewers menu meanwhile."
                  exit 1
                  ;;
              esac
            fi

            if [ -z "$pr_id" ] || [ -z "$head" ]; then
              unread=$((unread + 1))
            elif [ "$pr_state" != 'OPEN' ]; then
              report "Nothing asked on #${PR_NUMBER}: it is ${pr_state}."
              exit 0
            elif [ "$draft" = 'true' ]; then
              report "Nothing asked on #${PR_NUMBER}: it became a draft, which the ruleset does not review either."
              exit 0
            elif found=$(copilot_in "$reviewed"); then
              report "Nothing asked on #${PR_NUMBER}: a Copilot round is already on its head, ${head}, by ${found}."
              exit 0
            elif found=$(copilot_in "$pending"); then
              if [ "$looks" -eq 1 ] || [ $((looks % 4)) -eq 0 ]; then
                printf 'waiting: %s holds a review request on #%s, so a round is running or on order; the head is %s\n' \
                  "$found" "$PR_NUMBER" "$head"
              fi
            else
              # Nothing on order and no round on the head: ask, once. The Bot's node id is looked up
              # here rather than written down, from the REST login GitHub documents for the request.
              reviewer_path=$(printf '%s' "$REVIEWER" | sed 's/\[/%5B/g; s/\]/%5D/g')
              bot_id=$(gh api "users/${reviewer_path}" --jq '.node_id // empty' 2>"$err_file") || bot_id=''
              if [ -z "$bot_id" ]; then
                lookup_error=$(cat "$err_file")
                printf '::error::could not look up the node id of %s to request it on #%s\n' "$REVIEWER" "$PR_NUMBER"
                printf '%s\n' "${lookup_error:-the lookup answered without a node id}"
                report "Copilot was NOT requested on #${PR_NUMBER} (${head}), opened by ${PR_AUTHOR}: the node id of ${REVIEWER} could not be looked up." \
                  "" \
                  '```' "${lookup_error:-the lookup answered without a node id}" '```' \
                  "" \
                  "A renamed or removed reviewer account fails here. Request Copilot from the Reviewers menu meanwhile."
                exit 1
              fi
              # The answer is kept rather than discarded: on a refusal everything `gh` wrote is
              # printed, and on an acceptance its `reviewRequests` are the state after the mutation.
              if ! answer=$(gh api graphql -f query="$MUTATION" -f pullRequestId="$pr_id" -f botId="$bot_id" 2>"$err_file"); then
                printf '::error::GitHub refused the request for %s on #%s\n' "$REVIEWER" "$PR_NUMBER"
                cat "$err_file"
                printf '%s\n' "$answer"
                report "Copilot was NOT requested on #${PR_NUMBER} (${head}), opened by ${PR_AUTHOR}: GitHub refused the call." \
                  "" \
                  '```' "$(cat "$err_file")" "$answer" '```' \
                  "" \
                  "An expired or revoked token, or one without Pull requests write on this repository, fails" \
                  "here. Request Copilot from the Reviewers menu meanwhile."
                exit 1
              fi
              if ! requested=$(printf '%s' "$answer" | jq -r '[.data.requestReviews.pullRequest.reviewRequests.nodes[]?.requestedReviewer.login // empty] | join(" ")'); then
                printf '::error::GitHub accepted the request on #%s, and its answer could not be read — refusing to report a request this job cannot see\n' "$PR_NUMBER"
                printf '%s\n' "$answer"
                report "Copilot's request on #${PR_NUMBER} (${head}) is UNCONFIRMED: GitHub accepted the call and its answer could not be read." \
                  "" \
                  "The answer is printed in full in this job's log. Request Copilot from the Reviewers menu."
                exit 1
              fi
              # ACCEPTED IS NOT RECORDED. The mutation answers with the pull request as it stands
              # after the call, and a request GitHub did not record is one whose review requests do
              # not name Copilot; the earlier script measured exactly that on pull requests GitHub
              # would not bill.
              if ! found=$(copilot_in "$requested"); then
                printf '::error::GitHub accepted the request on #%s, and its answer does not list Copilot among the review requests\n' "$PR_NUMBER"
                printf 'Review requests in the answer:%s\n' "${requested:+ $requested}"
                printf '%s\n' "$answer"
                report "Copilot was NOT requested on #${PR_NUMBER} (${head}), opened by ${PR_AUTHOR}: GitHub answered and its review requests are: ${requested:-none}." \
                  "" \
                  "GitHub did not record the request. The answer is printed in full in this job's log." \
                  "Request Copilot from the Reviewers menu; if that works where this did not, the token is" \
                  "what to look at."
                exit 1
              fi
              printf '%s\n' "$answer"
              waited=$(( $(date +%s) - started ))
              report "Requested ${REVIEWER} on #${PR_NUMBER} (${head}) with the maintainer's token after ${waited}s, and" \
                "GitHub's answer lists ${found} among the review requests." \
                "" \
                "The author, ${PR_AUTHOR}, is a bot, and GitHub bills a review on a bot's pull request to the" \
                "organisation. A request by the maintainer is attributed to him, like his click in the Reviewers" \
                "menu. Whether Copilot's round lands is what copilot-reviewed checks."
              exit 0
            fi

            if [ $(( $(date +%s) - started )) -ge "$WAIT_SECONDS" ]; then
              if [ -n "$pr_id" ] && [ -n "$head" ]; then
                printf '::warning::Copilot still held a review request on #%s at the last look, %ss in, so nothing was asked for %s\n' \
                  "$PR_NUMBER" "$WAIT_SECONDS" "$head"
                report "Nothing asked on #${PR_NUMBER} (${head}): Copilot still held a review request at the last look, ${WAIT_SECONDS}s in, so a round was running or on order." \
                  "" \
                  "If no round lands on ${head}, re-run this job, which asks once nothing is on order."
              else
                printf '::warning::the pull request #%s could not be read at %s of %s looks in %ss, so nothing was asked\n' \
                  "$PR_NUMBER" "$unread" "$looks" "$WAIT_SECONDS"
                report "Nothing asked on #${PR_NUMBER}: the pull request could not be read at ${unread} of ${looks} looks, the last one included." \
                  "" \
                  '```' "${last_error:-the read answered without a pull request}" '```' \
                  "" \
                  "Re-run this job once GitHub answers, or request Copilot from the Reviewers menu."
              fi
              exit 0
            fi
            sleep "$POLL_SECONDS"
          done
