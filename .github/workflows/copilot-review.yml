# A pull request waits for the Copilot round on the commit it is actually merging.
#
# The policy is `.portulan/gate-map.md` → *Merge discipline*, and this file is only the checker — the
# same split as `.portulan/gates.json` and `cli/compile.mjs`.
#
# ## Why this exists: resolution was only half the rule
#
# `main` already requires conversation resolution, which covers the RESOLVED half — a Copilot thread
# cannot be ignored. Nothing covered the AWAITED half. Copilot is *requested* on every pull request by
# repository ruleset and nothing made a merge wait for it, so a merge could land in the window between
# the final push and the review arriving — and did: the maintainer found closed pull requests where
# Copilot's round on the last push landed after the merge, its feedback disregarded by nobody in
# particular. That is the shape of `.portulan/memory/a-mandate-nothing-checks-is-already-broken.md`: a
# reviewer everyone relied on, with nothing making the reliance real.
#
# ## The current head SHA is the whole point
#
# A review on an EARLIER commit must not satisfy this. That is the exact defect being closed — the
# review existed, it just described a different tree than the one merging. So every review is matched on
# `commit_id` against the pull request's current head, and `synchronize` re-runs this check on every
# push, which puts it back to pending the moment the branch moves.
#
# ## Waiting is not failing — the three states this check used to collapse into one
#
# **AMENDED 2026-07-28.** The first cut had two outcomes for a question with three answers, so *awaiting*
# was reported in the same colour as *broken*:
#
# | State | What it means | First cut | Now |
# |---|---|---|---|
# | Awaited | requested, not answered yet | **failure** | the job stays *in progress* — a pending check |
# | Not owed | the ruleset does not request a round here | **failure**, permanently | success, with the reason printed |
# | Missing | the round never came, or the API is unreadable | failure | failure, after the wait budget |
#
# The first row was guaranteed noise: Copilot cannot have reviewed a commit that did not exist when the
# run started, so **every push produced a red check by construction**, and the reviews measured on this
# repository landed 1m53s–3m47s later (#49, #54, #57, 2026-07-28). A red X that is *expected* on every
# push is how a gate gets read as background weather. A pending check says the true thing — the answer is
# not in yet — and it blocks a merge just as hard, which is the part that has to keep working.
#
# The second row was worse, because it never cleared: ruleset `copilot auto-review on pull requests` is
# `review_draft_pull_requests: false`, so on a draft **no round is ever coming** and the old check red-X'd
# every push for the life of the draft. See the `draft` branch below for why reporting success there does
# not open the gate, and for the one window it does leave.
#
# ## It also prints the half of the round that no gate can see
#
# `required_conversation_resolution` covers Copilot's *threads*. Its low-confidence comments are not
# threads — they sit inside the review body, with no Resolve control and no effect on any check, so the
# platform states them once and never mentions them again. Catching them was a manual sweep of
# `/pulls/N/reviews` that an agent had to remember, and forgetting it has already cost this repository a
# correct finding that sat for three days
# (`.portulan/memory/verify-preconditions-fail-closed.md`). This job reads that endpoint anyway, so on
# green it extracts them into the run's job summary. **It changes no verdict** — a note is not a blocker,
# and making it one would be a different rule than the one the maintainer gave.
#
# ## And since 2026-07-29 the round's outcome is displayed as a review
#
# A second step computes what the round amounts to and submits it as a real review by the agent
# identity: APPROVE on a clean round, APPROVE with the suppressed notes quoted when they are the
# round's only content — "approve with suggestions" — and nothing when the round raised inline
# comments, because threads and conversation resolution already carry findings. Copilot itself cannot
# say any of this: the platform submits every Copilot round as a COMMENT review, by design. The four
# branches, the staleness sweep, and what the step is NOT live in that step's own comment below; the
# policy half is `.portulan/gate-map.md` → *Merge discipline*.
#
# ## It still fails CLOSED
#
# An unreadable API is never taken as an answer — it is retried, and if it is still unreadable when the
# wait budget runs out, this reports FAILURE and prints the last error. "Could not look" is never
# "nothing wrong" — `.portulan/memory/verify-preconditions-fail-closed.md`, and the same three-code
# discipline the verify recipes use. The cost is that a GitHub API outage blocks merges; the alternative
# is a gate that opens whenever it is unwell, which is not a gate.
#
# ## The fragile part, named rather than hidden
#
# **Which login is "Copilot" is a platform fact this file hard-codes**, and it is the thing most likely
# to break silently — a rename would make this check red on every pull request (loud, fixable) or, worse,
# match nothing while looking healthy. The set below is matched case-insensitively and covers the
# spellings observed on this repository (`copilot-pull-request-reviewer[bot]` raising threads on #44,
# and `Copilot`). A rename shows up as a permanent red with the observed logins printed, which is the
# failure direction to prefer.

name: copilot review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  # `pull_request_review` WAS a trigger here and is deliberately gone — **removed 2026-07-28**, with the
  # measurement that killed it, because the reason it was added is now served by waiting instead.
  #
  # It was there to turn the check green when the review landed. It could not: the triggering actor is
  # the bot `Copilot`, so GitHub held the run as `action_required`, awaiting a maintainer's *Approve and
  # run*. The awaited guarantee therefore cost one click per pull request. It also fired on reviews that
  # could not possibly change the answer — the agent's own replies to Copilot are submitted as reviews
  # (`portulan-agent[bot]`, empty body), and each one re-ran this check and printed a fresh failure while
  # the round was still in flight: three such runs on 2026-07-27 alone (20:35:57 ×2, 21:26:26).
  #
  # The job now waits for the review inside the run it already has, on the `pull_request` event, which is
  # not bot-triggered and needs no approval. **The click is gone and so is that class of false red.**
  # The cost of dropping it: if the wait budget expires before the review lands, nothing re-triggers the
  # check — a maintainer re-runs the job, which is the same click as before but only in the rare case
  # rather than every time.

# `write`, not `read`, as of 2026-07-29 — for the one POST below that re-requests Copilot mid-wait.
#
# A `permissions:` block REPLACES the default, so every scope not named here is `none`: this job can
# still touch nothing outside pull requests. What the widening does NOT buy is a single call —
# `pull-requests: write` is the smallest scope GitHub offers that includes requesting a reviewer, and
# it carries the rest of the pull-request write surface (labels, comments, edits, merge state) with
# it. The restraint is that this job makes exactly one write and the scope is the floor for making it,
# not that the token is incapable of more. Said this way because the sentence here used to claim it
# "grants exactly the review-request call and nothing else", which is a stated limit the platform does
# not enforce — `a-stated-enforcer-must-be-the-real-one` binds this file's prose as much as its shell.
#
# One write this scope still does NOT carry, measured rather than inferred: an APPROVING review.
# `can_approve_pull_request_reviews` is `false` at organisation and repository (read back 2026-07-29,
# `gh api repos/{owner}/{repo}/actions/permissions/workflow`), so the verdict step below could not
# submit its approval on this token even with the write scope — and that refusal standing is a
# feature: the derived verdict rides an App installation token minted in-step, so the identity that
# runs unattended jobs and the identity that speaks about code stay distinct.
#
# `contents: read` is declared for the checkout the verdict step needs (the token minter lives in the
# tree), and the declaration is the point rather than the present need: this file's first run under a
# block that omitted it checked out anyway, because public contents need no scope. What the omission
# really was is a visibility coupling — a repository made private again would have a review gate that
# cannot fetch itself, discovered at the worst moment. Named now, while it is free. Raised by Copilot
# on #95.
permissions:
  contents: read
  pull-requests: write

# A push supersedes the run waiting on the commit it replaced. Without this, the old run keeps polling a
# head that is no longer the head, for up to the full budget, on a runner it does not need.
concurrency:
  group: copilot-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  copilot-reviewed:
    runs-on: ubuntu-latest
    # The wait budget below is 20 minutes; this is the backstop for a job that hangs somewhere else.
    timeout-minutes: 25
    steps:
      # The tree is needed for exactly one thing: the token minter the verdict step runs
      # (`.portulan/tools/gh-bot-token.mjs`). Shallow is fine — nothing here reads git history.
      # Pinned to a full-length SHA because the organisation and this repository both set
      # `sha_pinning_required: true`; the same pin as the other workflows, so Dependabot bumps them
      # together.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: A Copilot review exists for the current head commit
        id: await
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          # No globbing: the reviewer logins below contain `[bot]`, which an unquoted
          # expansion would treat as a character class and match against filenames.
          set -f

          # The reviewer logins that count. Lower-case; compared lower-cased.
          REVIEWERS='copilot-pull-request-reviewer[bot] copilot copilot[bot]'

          # 20 minutes against a measured 1m53s–3m47s (#49, #54, #57, 2026-07-28) — five times the
          # slowest round observed. Long enough that expiry means something went wrong rather than
          # something was slow, which is the only way the red at the end of it is worth reading.
          WAIT_SECONDS=1200
          # Halfway. Late enough that an ordinary round (under four minutes here) has long since
          # landed and the re-request is never sent to a reviewer that was merely working; early
          # enough that the ~90s answer it buys still fits inside the budget with minutes to spare.
          REREQUEST_AFTER=600
          # none → attempted → sent | failed. Never "attempted" at the end unless the shell died
          # between the two assignments below.
          rerequest_state=none
          rerequest_at=''
          # 30s, not 5s: the budget is 40 polls of two reads each, well inside the 1,000/hour that
          # `GITHUB_TOKEN` gets per repository even with every open pull request waiting at once.
          POLL_SECONDS=30

          if [ -z "${PR_NUMBER:-}" ]; then
            printf '::error::no pull request number in the event payload — cannot tell what to check\n'
            exit 1
          fi

          head=''
          seen=''
          unread=''
          first_head=''

          while : ; do
            # Reset per poll: these describe one look at the pull request, not the accumulation of
            # every look. An authors-seen line that grew by a full review history every 30 seconds
            # would be unreadable in the one place it matters, the failure at the end.
            seen=''
            unread=''

            # The head SHA is read from the API rather than from the payload, and re-read on every
            # poll — a push during the wait must not be answered against the head this run started on.
            #
            # `|` and not a tab, in both `read`s below, and the reason is a bash rule rather than a
            # preference: **a tab is IFS whitespace**, so `IFS=$'\t' read` drops a leading empty field
            # and collapses adjacent separators. A null `head.sha` would arrive as `<tab>false` and be
            # read as `head=false`, sailing past the "no head SHA" guard below to spend the whole
            # budget comparing reviews against the string `false`. `|` is not IFS whitespace, so the
            # empty field survives and the guard fires. Neither a SHA, a login, nor a review state can
            # contain one.
            # The third field is the author's login, and it exists for the verdict step: an
            # App-authored pull request can never receive the App's own approval (the platform
            # refuses self-approval), so the verdict step needs to know who opened this. A ghost
            # author (`user: null`) arrives as an empty field, which equals no login and skips
            # nothing it shouldn't.
            if ! pr=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
                  --jq '[.head.sha, (.draft|tostring), .user.login] | join("|")'); then
              unread="could not read pull request #${PR_NUMBER}"
            else
              # A here-string, not a here-doc. A here-doc body would have to sit at exactly this
              # block scalar's indent — ten spaces, no more, no fewer — for YAML to strip it back to
              # column 0. One space either way and, because `|` is not IFS whitespace, `read` keeps
              # the difference: `head` becomes `   <sha>`, matches no `commit_id`, and the job waits
              # out its whole budget over invisible characters. A here-string has no such coupling.
              IFS='|' read -r head draft author <<<"$pr"
              # Not `unread`, and not a retry. The two failures are different in kind and only one of
              # them is worth waiting on: a transport error means the answer is unknown and may arrive
              # on the next poll, but this is a SUCCESSFUL read whose answer is that the pull request
              # has no head. Waiting cannot make a well-formed answer say something else, so twenty
              # minutes of polling would buy nothing and bury a precise fault under the generic
              # timeout message twenty minutes later.
              #
              # The first cut of this file failed here immediately — "refusing to guess". Folding it
              # into the retry loop was a regression introduced by the rewrite that added waiting, and
              # it was caught by a suppressed low-confidence Copilot note on #63 that nothing but this
              # pull request's own surfacing step would have shown anyone.
              if [ -z "${head:-}" ] || [ "$head" = "null" ]; then
                printf '::error::pull request #%s reported no head SHA — refusing to guess.\n' "$PR_NUMBER"
                printf 'The API answered and the answer was malformed, which no amount of waiting fixes.\n'
                exit 1
              fi
            fi

            # A failed or empty read is NOT an answer — fall through to the retry. Only the budget
            # running out turns "could not look" into a verdict, and that verdict is red.
            if [ -z "$unread" ]; then
              if [ -z "$first_head" ]; then
                first_head="$head"
                printf 'head commit: %s\n' "$head"
              elif [ "$head" != "$first_head" ]; then
                printf 'SUPERSEDED — the branch moved from %s to %s while this run waited.\n' "$first_head" "$head"
                printf 'The run for the new head owns that commit; this one has nothing left to answer.\n'
                # Exit 0 is safe here and only here: this run reports against %s, which is no longer
                # the head, and a merge is gated on the check runs of the head commit. Reaching this
                # branch at all means `cancel-in-progress` did not get there first.
                exit 0
              fi

              # NOTHING TO REVIEW — ruleset `copilot auto-review on pull requests` carries
              # `review_draft_pull_requests: false`, so a draft is never sent to Copilot and no round
              # is owed. Failing here would be a red that no push, no wait, and no review could clear.
              #
              # Reporting success does not open the gate: GitHub refuses to merge a draft at all, and
              # `ready_for_review` is in the trigger list above, so the real check runs the moment the
              # pull request stops being one. **The window it does leave, named rather than found
              # later:** marking ready does not change the SHA, so for the seconds between that click
              # and the new run reporting, the head's newest check run is this success.
              #
              # Nothing else covers that window, and an earlier draft of this comment claimed
              # otherwise. `workspace-verify` and `pr-labeled` run on draft pushes too, so on a mature
              # draft they are ALREADY green on that SHA and `ready_for_review` re-runs neither; and
              # conversation resolution is trivially satisfied, because Copilot never reviewed the
              # draft and so there are no threads to resolve. **The only guard in the window is that a
              # merge here is Gated and human.** That is an acceptable residual on this repository and
              # it stops being one the moment auto-merge is enabled — see `.portulan/gate-map.md`,
              # *Merge discipline*, which owns that interaction.
              if [ "$draft" = "true" ]; then
                printf 'NOT APPLICABLE — #%s is a draft, and the ruleset does not request Copilot on drafts.\n' "$PR_NUMBER"
                printf 'A draft cannot merge; this check runs for real on ready_for_review.\n'
                exit 0
              fi

              # `--paginate`, because a pull request with a long review history would otherwise have
              # its newest reviews on a page this never fetched — a check that silently examines the
              # first thirty of forty reviews is the fail-open in miniature.
              if ! reviews=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews" \
                    --jq '.[] | [.user.login, .commit_id, .state, (.id|tostring)] | join("|")'); then
                unread="could not read the reviews on #${PR_NUMBER}"
              else
                matched=0
                matched_id=''
                while IFS='|' read -r login commit state id; do
                  [ -n "${login:-}" ] || continue
                  lower=$(printf '%s' "$login" | tr '[:upper:]' '[:lower:]')
                  seen="$seen $lower"
                  for candidate in $REVIEWERS; do
                    # A DISMISSED review is an invalidated one — it must not satisfy the await.
                    if [ "$lower" = "$candidate" ] && [ "$commit" = "$head" ] && [ "$state" != "DISMISSED" ]; then
                      printf 'found: %s reviewed %s (%s)\n' "$login" "$commit" "$state"
                      matched=1
                      # The API returns reviews oldest-first, so the last match is the newest round on
                      # this head — Copilot reviews the same SHA twice when a re-review is requested
                      # (measured on #57, `599fd30` at 06:56:49Z and again at 07:00:07Z, 2026-07-28).
                      matched_id="$id"
                    fi
                  done
                done <<<"$reviews"

                if [ "$matched" -eq 1 ]; then
                  printf 'GREEN — Copilot has reviewed the current head commit.\n'

                  # THE HALF NOBODY READS. Copilot's low-confidence comments are delivered inside the
                  # review BODY: no thread, no Resolve control, and therefore no effect on
                  # `required_conversation_resolution`. Nothing in the platform surfaces them and
                  # nothing gates on them, so until now the only thing between those notes and oblivion
                  # was an agent remembering to sweep `/pulls/N/reviews` by hand. The repository has
                  # already paid for forgetting once —
                  # `.portulan/memory/verify-preconditions-fail-closed.md` records a suppressed comment
                  # that was right, sat for three days, and appears nowhere in the record of addressed
                  # feedback. This job already reads that endpoint, so it prints them.
                  #
                  # **This changes no verdict.** The check is green either way; a note is not a
                  # blocker, and making it one would be a different rule than the one the maintainer
                  # gave. What it must not do is go quiet when it could not look — that is the false
                  # green this whole file exists to refuse — so an unreadable body says so.
                  # `notes_state` rides to the verdict step below, and its four values are the four
                  # facts the parse can establish — none, present, unparsable, unread. The verdict
                  # approves on the first two only: the last two are "could not look", and a verdict
                  # computed over an unread channel is the false green this file refuses.
                  report=''
                  notes_state=''
                  notes_file=''
                  if ! body=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews/${matched_id}" \
                        --jq '.body // ""'); then
                    report='**Could not read review body `'"${matched_id}"'`.** Sweep `/pulls/'"${PR_NUMBER}"'/reviews` by hand — this section is not evidence of absence.'
                    notes_state='unread'
                    printf 'suppressed low-confidence notes: COULD NOT READ review %s\n' "$matched_id"
                  else
                    # THE SECTION MARKER MOVES, AND IT DOES NOT MOVE IN ONE DIRECTION. Measured by
                    # sweeping `/pulls/N/reviews` by hand on 2026-07-31 for #142, Copilot has
                    # announced this section FOUR ways on this repository. Both axes vary
                    # independently — the container (a `<summary>`, or a markdown heading nested
                    # inside `<summary>Review details</summary>`) and the phrase:
                    #
                    #   1. `<summary>Comments suppressed due to low confidence (N)</summary>`  (#109,
                    #      #129, #135, #137)
                    #   2. `### Comments suppressed due to low confidence (N)`   (#107, 2026-07-29)
                    #   3. `<summary>Suppressed comments (N)</summary>`                (#137, #145)
                    #   4. `### Suppressed comments (N)`                               (#140, #144)
                    #
                    # The matcher was spelling 1 as a literal, so 3 and 4 did not contain it, the
                    # step took its no-such-section branch, and it printed `Read, not assumed` over
                    # bodies that carried real notes.
                    #
                    # **They INTERLEAVE rather than superseding one another** — on the morning of
                    # 2026-07-31 spellings 4, 3 and 4 again arrived at 05:52, 06:04 and 06:12 — so
                    # no spelling may be treated as the current one and no repair may be written
                    # against the newest. That is the argument for the test below rather than a
                    # decoration on it: a line that ANNOUNCES a section — a `<summary>` OR a
                    # markdown heading — and contains `suppress`. The container varies, the phrase
                    # varies, and `suppress` is the only thing all four have in common.
                    # ONE matcher for all four questions — is the block there, what is its count,
                    # what is in it, and is absence real. The first cut asked with `grep`, `sed` and
                    # `awk` separately, so the three could disagree about the same line the moment
                    # Copilot's markup moved: a change of case alone made the detector say "absent"
                    # while the extractor would happily have read it. Same case-insensitive test,
                    # four answers, no drift.
                    SUPPRESS='suppress'
                    present=$(printf '%s\n' "$body" | awk -v m="$SUPPRESS" \
                      '(/<summary/ || /^#+[[:blank:]]/) && index(tolower($0), m) { print "yes"; exit }')
                    count=$(printf '%s\n' "$body" | awk -v m="$SUPPRESS" \
                      '(/<summary/ || /^#+[[:blank:]]/) && index(tolower($0), m) { if (match($0, /\([0-9]+\)/)) print substr($0, RSTART+1, RLENGTH-2); exit }')
                    # Terminated by the closing tag, by the NEXT heading, or by the stats list
                    # spelling 4 puts after the notes — without the last two, a spelling-4 block
                    # quotes `Files reviewed: 3/3` onto the pull request as though Copilot had
                    # suppressed it.
                    #
                    # THE HEADING TESTS ARE ANCHORED AT COLUMN 0 DELIBERATELY, and it was put to the
                    # test: Copilot asked on #147 for leading whitespace to be tolerated, in case a
                    # heading is ever indented inside a `<details>`. Measured before answering — no
                    # marker on #107, #140 or #144 is indented, every one sits at column 0, while
                    # the review body making the request **itself** carried an indented `#` line
                    # mentioning `suppress`, inside a quoted code block. Tolerating indentation
                    # would therefore have matched quoted CODE as a section marker, on the very
                    # round that proposed it, and would have ended the notes extraction at the
                    # first indented comment in any quoted snippet. Column 0 is what separates a
                    # section heading from content that merely looks like one, and in a repository
                    # whose reviews routinely quote this file at itself that separation is
                    # load-bearing. If an indented marker is ever observed, the fixture goes in
                    # first and the anchor changes second.
                    notes=$(printf '%s\n' "$body" | awk -v m="$SUPPRESS" '
                      (/<summary/ || /^#+[[:blank:]]/) && index(tolower($0), m) { f = 1; next }
                      f && (/<\/details>/ || /^#+[[:blank:]]/ || /^- \*\*Files reviewed:/) { exit }
                      f { print }')
                    # ABSENCE NEEDS POSITIVE EVIDENCE, which is the half #142 is really about. A
                    # structural matcher is still a matcher: move the section again and the silent
                    # failure returns. So `none` is licensed by the word `suppress` being absent
                    # from the WHOLE BODY — not by a marker failing to match, which is exactly the
                    # test that cannot tell "there is nothing here" from "I no longer recognise it".
                    #
                    # The two readings disagreeing — the word present, no marker matched — is the
                    # signature of a markup move, and it routes to `unparsable`. The trade is
                    # deliberate and it is not free: prose using the word in a body with no section
                    # makes this step say "read it by hand" when there was nothing to read, and
                    # `unparsable` suppresses the verdict, so that cost lands the same day and in
                    # front of a person. A false zero costs nothing visible and hides findings for
                    # an unknown number of rounds — which is what happened, on FOUR rounds measured
                    # from this repository's own run logs: #145, #144 twice, and #137. Loud and
                    # wrong is recoverable; quiet and wrong is what this file exists to refuse.
                    #
                    # ONE HOLE THIS DOES NOT CLOSE, named because the sweep found it and no body
                    # matcher can reach it: on #140 the step reported none at 05:32:53Z and the
                    # note-bearing review was submitted at 05:36:45Z, four minutes later, with no
                    # further round to re-read it. That is a review landing after the last parse,
                    # not a parse getting it wrong, and it is the awaited half of this file's own
                    # subject arriving for the notes channel too.
                    anywhere=$(printf '%s\n' "$body" | awk -v m="$SUPPRESS" \
                      'index(tolower($0), m) { print "the-word-is-here"; exit }')
                    # THREE outcomes, not two. The block being absent and the block being
                    # unparseable are different facts, and only one of them licenses the word
                    # "none". Collapsing them would print a positive claim — `Read, not assumed` —
                    # over a parse that failed, so a change to Copilot's markup would silently turn
                    # this step off while it kept reporting healthily. That is the false green this
                    # entire file exists to refuse, reintroduced by the step added to prevent a
                    # different one. Caught by a suppressed low-confidence note on #63, in round
                    # five, about the very mechanism that surfaced it — and then reintroduced anyway
                    # by a literal, which is #142 and the reason the branch order below now tests
                    # what it FOUND before it tests what it did not.
                    if [ -z "${present:-}" ] && [ -n "${anywhere:-}" ]; then
                      report="**Could not parse the review body** on the round for \`${head}\`: it uses the word \`suppress\` and no section marker — a \`<summary>\` or a heading — matched. Copilot's markup has probably moved again, which it has done twice already (#142). Sweep \`/pulls/${PR_NUMBER}/reviews\` by hand and teach this step the new spelling. **This is not a report of zero notes.**"
                      notes_state='unparsable'
                      printf 'suppressed low-confidence notes: PARSE FAILED — the word is in the body and no marker matched\n'
                    elif [ -z "${present:-}" ]; then
                      report="No suppressed low-confidence comments on the round for \`${head}\`. Read, not assumed — the word \`suppress\` does not occur anywhere in the review body, which is evidence of absence rather than a matcher failing to find what it was looking for."
                      notes_state='none'
                      printf 'suppressed low-confidence notes: none on this round\n'
                    elif [ -z "${count:-}" ] || [ -z "${notes:-}" ]; then
                      report="**Could not parse the suppressed-comments block** on the round for \`${head}\`, though the body contains one. Copilot's markup has probably changed — read the review body by hand and fix the extraction. **This is not a report of zero notes.**"
                      notes_state='unparsable'
                      printf 'suppressed low-confidence notes: PARSE FAILED — block present, extraction empty\n'
                    else
                      # Built by appending rather than as one multi-line literal: a continuation line
                      # would have to sit at column 0 to avoid leading spaces in the output, and a
                      # column-0 line ENDS this YAML block scalar. That broke the file once already
                      # and the shell tests still passed, because they were fed a hand-sliced copy of
                      # the block instead of one YAML had parsed.
                      report="**${count} comment(s) suppressed as low confidence** on the round for \`${head}\`."
                      report="${report}"$'\n'"They carry no thread and no Resolve control, so nothing"
                      report="${report} gates on them: unanswered, they simply stand. If this"
                      report="${report} round raised no inline comment, the verdict review quotes"
                      report="${report} them onto the pull request; if it did, there is no verdict"
                      report="${report} review, and outside Copilot's own review body — where they"
                      report="${report} sit collapsed — THIS REPORT is the only place they surface."
                      report="${report} Address or refuse each one, per the standing feedback-loop"
                      report="${report} rule, in ONE batched pull-request comment — a note has no"
                      report="${report} thread to sit on, which is why it is answered there and an"
                      report="${report} inline comment never is."$'\n\n'"${notes}"
                      notes_state='present'
                      # The raw notes, filed for the verdict step: a review body travels badly
                      # through GITHUB_OUTPUT (a delimiter collision away from truncation), and
                      # RUNNER_TEMP is shared between steps of one job.
                      notes_file="$RUNNER_TEMP/copilot-notes.md"
                      printf '%s\n' "$notes" >"$notes_file"
                      printf 'suppressed low-confidence notes: %s\n' "$count"
                    fi
                  fi

                  if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
                    {
                      printf '## Copilot notes that no gate can see\n\n'
                      printf '%s\n' "$report"
                    } >>"$GITHUB_STEP_SUMMARY"
                  else
                    printf '%s\n' "$report"
                  fi
                  # Only this exit sets `round=green`, which is the verdict step's whole gate: the
                  # draft and SUPERSEDED exits above are 0 too, and neither describes a round the
                  # verdict may act on.
                  {
                    printf 'round=green\n'
                    printf 'head=%s\n' "$head"
                    printf 'review_id=%s\n' "$matched_id"
                    printf 'author=%s\n' "${author:-}"
                    printf 'notes_state=%s\n' "$notes_state"
                    printf 'notes_count=%s\n' "${count:-0}"
                    printf 'notes_file=%s\n' "$notes_file"
                  } >>"$GITHUB_OUTPUT"
                  exit 0
                fi
              fi
            fi

            # ONE re-request, halfway through the budget — issue #88, and it is measured rather than
            # guessed. On #86, the scheduled librarian's first real pull request, the auto-request was
            # made and ACCEPTED (`requested_reviewers` read `["Copilot"]`) and no review came in the
            # full twenty minutes. An explicit re-request then produced one in about **ninety
            # seconds**. So waiting alone bought nothing and asking again bought everything, and the
            # difference is not slowness — maintainer-opened pull requests here draw rounds in
            # 1m53s–3m47s.
            #
            # The repair goes HERE rather than in `librarian.yml` because the fault is not the
            # librarian's: any App- or bot-authored pull request meets it, and this file is the one
            # place every pull request passes through. It also sidesteps the thing that is NOT
            # established — whether an explicit request made *seconds* after `gh pr create` behaves
            # like the silent auto-request or like the answered late one. Only the late case is
            # measured, and only the late case is what this does.
            #
            # Once, not per poll: re-requesting in a loop would be a write amplified 20× against a
            # reviewer that may simply be busy. A failed POST is printed and never fatal — the verdict
            # below is still the wait's to render, and a re-request that could not be made is not a
            # finding about the review.
            # `rerequest_state` records what was ESTABLISHED, not what was intended. It is set before
            # the POST so the attempt happens once either way, and then corrected by the result —
            # because a line reading "Copilot was re-requested" after a POST that failed would be this
            # file claiming a cause it had not established, which is the exact defect the #89 half of
            # this same change removes from the timeout message. `rerequest_at` holds the second the
            # attempt actually happened rather than the second it was scheduled for, so the verdict
            # below has one carrier for that fact instead of two that can disagree.
            if [ "$rerequest_state" = none ] && [ "$SECONDS" -ge "$REREQUEST_AFTER" ]; then
              rerequest_at="$SECONDS"
              rerequest_state=attempted
              if gh api --method POST \
                    "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/requested_reviewers" \
                    -f 'reviewers[]=Copilot' >/dev/null; then
                rerequest_state=sent
                printf 're-requested Copilot at %ss — measured to answer in ~90s on #86 (2026-07-29).\n' "$rerequest_at"
              else
                rerequest_state=failed
                printf 'could not re-request Copilot at %ss; continuing to wait.\n' "$rerequest_at"
              fi
            fi

            [ "$SECONDS" -lt "$WAIT_SECONDS" ] || break

            if [ -n "$unread" ]; then
              printf 'waiting (%ss of %ss): %s — retrying\n' "$SECONDS" "$WAIT_SECONDS" "$unread"
            else
              printf 'waiting (%ss of %ss): no Copilot review for %s yet\n' "$SECONDS" "$WAIT_SECONDS" "$head"
            fi
            sleep "$POLL_SECONDS"
          done

          # Two timeouts, two different faults, and the check must not claim the one it did not
          # establish. "No review arrived" is a finding about Copilot. "The API stayed unreadable" is
          # a finding about GitHub, and it leaves `head` holding whatever the last SUCCESSFUL poll
          # returned — possibly minutes stale, possibly not the head any more. Naming that SHA as the
          # commit with no review would send a reader to investigate a reviewer that may have answered
          # perfectly well. The verdict is red either way; only the sentence differs.
          # The request list is read BEFORE the verdict is composed, and that ordering is the whole of
          # issue #89. It used to be printed *after* a paragraph that named two causes — a dead ruleset
          # or a renamed login — and on #86 neither was the cause: the check's own last two lines were
          # `Review authors seen: none` and `Reviewers requested and still unanswered:` **empty**. The
          # data that distinguished the faults was already computed, one line below prose that sent the
          # reader past it. A message that names a cause it has not established is the same defect as a
          # checker that reports what it could not check
          # (`.portulan/memory/a-checker-must-refuse-what-it-cannot-check.md`), pointed at a diagnostic
          # instead of a verdict. The check is right to fail here; only the sentence was wrong.
          requested=''
          requested_read=0
          if requested=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/requested_reviewers" \
                --jq '[.users[].login] | join(" ")'); then
            requested_read=1
          fi

          if [ -n "$unread" ]; then
            printf '::error::could not confirm a Copilot review on #%s after %ss — the API was still unreadable at the last attempt: %s\n' \
              "$PR_NUMBER" "$SECONDS" "$unread"
            printf 'This is not a finding about the review. It is "could not look", held for the whole\n'
            printf 'budget, which stays red because a gate that opens when it is unwell is not a gate.\n'
            printf 'The last head SHA read successfully was %s, which may be stale — do not act on it.\n' "${head:-none}"
          else
            printf '::error::no Copilot review for the current head commit (%s) after %ss of waiting.\n' \
              "$head" "$SECONDS"
            printf 'A pull request may not merge until Copilot has reviewed the commit it is actually\n'
            printf 'merging, and until that feedback is resolved. Conversation resolution covers the\n'
            printf 'resolved half; this covers the awaited half.\n\n'
            # FOUR outcomes, because the answer to "was a round even requested?" has four states and
            # only three of them license naming a cause. Each names the repair that fits ITS fault.
            #
            # The fourth was added 2026-08-03, after #157 printed the third one over it. An empty
            # request list was read as *the request was never created for this actor* while
            # `rerequest_state` held `sent` — a POST this job had made and GitHub had ACCEPTED, and
            # which the message then printed as a flat contradiction four lines further down. An empty
            # list has two causes and the list alone cannot separate them: nobody ever asked, or
            # somebody asked and the reviewer LEFT the list without answering. The comment under
            # `Reviewers requested and still unanswered` already stated that rule correctly and the
            # code above it did not implement it — #89's defect returned to the message #89 fixed.
            # So the split is on what this job ESTABLISHED with its own write, never on the list alone.
            if [ "$requested_read" -eq 0 ]; then
              printf 'Whether a round was ever requested could NOT be read, so this message names no\n'
              printf 'cause: the faults below have different repairs and nothing here distinguishes\n'
              printf 'them. Read repos/%s/pulls/%s/requested_reviewers by hand.\n' "$GITHUB_REPOSITORY" "$PR_NUMBER"
            elif [ -z "$requested" ] && [ "$rerequest_state" = sent ]; then
              printf 'REQUESTED, ACCEPTED, AND GONE — the one fault on this list that re-running does\n'
              printf 'not repair. This job POSTed a review request at %ss and GitHub ACCEPTED it, so a\n' "$rerequest_at"
              printf 'request WAS created for this actor. It is no longer on the list and no review\n'
              printf 'arrived. WHAT removed it is not established here — the reviewer, a person, or\n'
              printf 'some automation are all consistent with what this job can see, and it saw only\n'
              printf 'the two endpoints. The login is not worth checking: GitHub accepted it, so it\n'
              printf 'resolves. The RULESET is a separate question and this message cannot answer it —\n'
              printf 'an explicit POST creates a request whatever the ruleset does, so nothing here\n'
              printf 'shows it is healthy. What is shown is narrower: a request existed and stopped\n'
              printf 'existing, which a ruleset that never requests one cannot explain.\n'
              printf 'Measured on #157 (2026-08-03): a rebase force-push whose diff moved seven derived\n'
              printf 'numbers drew no round at all — `review_on_push` did not fire for it, and the\n'
              printf 're-request above went the same way. The reading that fits is that Copilot\n'
              printf 'declines a diff it has already reviewed, and no amount of asking changes that.\n'
              printf 'If so, THIS HEAD CANNOT GO GREEN, and what to do about it is a decision for the\n'
              printf 'maintainer rather than a repair for this job.\n'
            elif [ -z "$requested" ]; then
              printf 'NOTHING IS HOLDING A REQUEST, and that is a different fault from a reviewer going\n'
              printf 'silent. What is established is the empty list and nothing more: no request from\n'
              printf 'this job was ever ACCEPTED, which is not the same as nobody having asked — see the\n'
              printf 'line below for what this job did or did not manage. On #86 the cause was that\n'
              printf '**the author was a bot** and no auto-request was made for it. Treat that as the\n'
              printf 'lead rather than the finding: check the Copilot ruleset applies to pull requests\n'
              printf 'from this author, then re-run the job.\n'
              # What the mid-wait re-request established, and only that. `sent` never reaches here —
              # it is the one state that makes this a different fault, handled in the branch above.
              # `failed` DOES reach here, so the paragraph above must not say the job never asked: it
              # asked and the call failed, which the sub-message below is the carrier for. Raised by
              # Copilot on #160 — the same defect this whole change is about, committed inside it.
              case "$rerequest_state" in
                failed)   printf 'The mid-wait re-request at %ss could NOT be sent, so whether asking again would have worked is untested.\n' "$rerequest_at" ;;
                none)     printf 'The wait ended before the %ss re-request point, so no re-request was attempted.\n' "$REREQUEST_AFTER" ;;
              esac
            else
              printf 'REQUESTED AND UNANSWERED — the reviewer holds the request and did not deliver:\n'
              printf '  %s\n' "$requested"
              printf 'That is the ruleset-and-login fault. Rounds here land in under four minutes, so a\n'
              printf 'full budget spent waiting is a fault rather than slowness: check the Copilot\n'
              printf 'ruleset is still active and that the login above has not been renamed, then re-run\n'
              printf 'this job — it is not bot-triggered and needs no approval. Measured 2026-07-28.\n'
            fi
          fi
          printf '\nReview authors seen on this pull request:%s\n' "${seen:- none}"
          # Printed for both verdicts. An entry disappears from this list when a review is submitted,
          # and — measured on #157 (2026-08-03) — it can also disappear with no review arriving. What
          # removes it is not observable from here in either case. So absence proves nothing about
          # whether a round was ever asked for, and nothing about whether it was answered, which is
          # why the branch above splits on this job's own accepted POST rather than on this line.
          if [ "$requested_read" -eq 1 ]; then
            printf 'Reviewers requested and still unanswered:%s\n' "${requested:+ $requested}"
          else
            printf 'Reviewers requested and still unanswered: COULD NOT READ\n'
          fi
          case "$rerequest_state" in
            sent)     printf 'Copilot was re-requested once during this wait, at %ss — accepted.\n' "$rerequest_at" ;;
            failed)   printf 'A re-request was attempted at %ss and the call FAILED.\n' "$rerequest_at" ;;
            attempted) printf 'A re-request was attempted at %ss with no result recorded.\n' "$rerequest_at" ;;
          esac
          exit 1

      # THE VERDICT, CARRIED WHERE THE PLATFORM CAN DISPLAY IT — added 2026-07-29, on the
      # maintainer's directive that a clean round read as an approval. Copilot cannot say it: the
      # platform submits every Copilot round as a COMMENT review — never an approval, never a
      # request for changes — by GitHub's deliberate design, re-checked against the docs the day
      # this shipped. So the round's outcome is COMPUTED here and submitted as a real review by the
      # agent identity, which is the identity this repository already uses to talk about code
      # without writing it (`.portulan/gate-map.md`, "Which identity acts"). Derived, never judged:
      #
      #   clean round (no inline comment, no suppressed note)  ->  APPROVE
      #   suppressed notes only                                ->  APPROVE with the notes quoted in
      #                                                            the body — "approve with
      #                                                            suggestions"; the body says the
      #                                                            approval is NOT their disposal
      #   any inline comment                                   ->  no review. Threads and
      #                                                            conversation resolution already
      #                                                            carry findings; a second gate on
      #                                                            a gated thing would be machinery
      #                                                            pretending to be policy. A prior
      #                                                            same-head approval is dismissed.
      #   notes present but unread or unparsable               ->  no review, loudly, and a prior
      #                                                            same-head approval is dismissed
      #                                                            here too. Approving over an
      #                                                            unread channel is the false
      #                                                            green this whole file refuses.
      #
      # WHAT THIS IS NOT. Not the merge gate: required approving reviews are 0 and every merge is
      # the maintainer's; an absent verdict blocks nothing that was open before it. Not required: a
      # failed submission is a loud warning, never a red — the step above already answered the
      # question a merge waits on, and a verdict layer that can red a mergeable pull request would
      # be a new false-red class in the file whose history is the removal of false reds.
      #
      # STALENESS. Nothing here relies on `dismiss_stale_reviews`. The head is re-read immediately
      # before acting and the step aborts as SUPERSEDED if it moved; and before any verdict branch,
      # on every run that computes one, any App approval naming a commit that is no longer the head
      # is dismissed — `cancel-in-progress` can land an approval AFTER the push that made it stale,
      # and an orphaned green chip would satisfy a future required count. A run that never reaches
      # the sweep (a fork, an App author, an unreadable read, a failed mint) sweeps nothing, which
      # is why the wording is "every run that computes a verdict" and not "every run".
      #
      # SELF-APPROVAL. The platform refuses an author approving its own pull request, and the App
      # authors the weekly librarian pull request. So App-authored pull requests get no derived
      # verdict, stated rather than attempted: the maintainer's own review is the verdict there,
      # which those pull requests already required.
      #
      # OBSERVATION (proposal 0007: a watcher earns its place by being watched). Every run prints
      # which branch it took, to the log and the job summary. The pull request that shipped this
      # step exercised two branches live, recorded in its body: the findings branch on its first
      # head, approve-with-suggestions on its second. Each other branch is unvouched until a round
      # exercises it, and names its test in advance: the plain approve on the first clean round
      # with no notes, suppression-plus-dismissal on the first finding round that follows an
      # approval, the self-approval skip on the next librarian pull request, the no-credentials
      # skip on the first fork. The App dismissing its own approval is likewise unmeasured until it
      # fires — as is the mid-wait re-request above (#88, merged via #96), which no run had yet
      # reached when this shipped — and every refusal prints as a warning AND a summary line, never
      # a log line alone: a warning in a green run's log as the entire notification mechanism is
      # the incident behind proposal 0006.
      - name: The round's verdict is carried as a review
        if: steps.await.outputs.round == 'green'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          AWAITED_HEAD: ${{ steps.await.outputs.head }}
          REVIEW_ID: ${{ steps.await.outputs.review_id }}
          AUTHOR: ${{ steps.await.outputs.author }}
          NOTES_STATE: ${{ steps.await.outputs.notes_state }}
          NOTES_COUNT: ${{ steps.await.outputs.notes_count }}
          NOTES_FILE: ${{ steps.await.outputs.notes_file }}
          PORTULAN_BOT_APP_ID: ${{ secrets.PORTULAN_BOT_APP_ID }}
          APP_KEY: ${{ secrets.PORTULAN_BOT_PRIVATE_KEY }}
        run: |
          set -uo pipefail
          # Same reason as the step above: reviewer logins contain `[bot]`, which an unquoted
          # expansion would treat as a character class.
          set -f

          # Loud or not at all. `say` is the ordinary voice; `warn` is for every skip-by-fault and
          # every refusal, and both write the job summary as well as the log.
          say() {
            printf '%s\n' "$1"
            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              printf '%s\n\n' "$1" >>"$GITHUB_STEP_SUMMARY"
            fi
          }
          warn() {
            printf '::warning::%s\n' "$1"
            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              printf '**%s**\n\n' "$1" >>"$GITHUB_STEP_SUMMARY"
            fi
          }

          if [ -z "${PORTULAN_BOT_APP_ID:-}" ] || [ -z "${APP_KEY:-}" ]; then
            warn "no verdict: the App credentials are not available to this run (a fork, or secrets unset). The check above already answered the awaited half; only the displayed approval is missing."
            exit 0
          fi
          if [ "$AUTHOR" = 'portulan-agent[bot]' ]; then
            say "no verdict: this pull request is App-authored and the platform refuses self-approval — the maintainer's own review is the verdict here."
            exit 0
          fi

          # The head, re-read at the last moment rather than trusted from the step above: a push
          # during the gap makes this run's verdict about a tree that is no longer the one merging.
          # Byte-identical to the read above on purpose — one program, two sites, one set of
          # fixtures in `.portulan/verify/workflow-filters.mjs`.
          if ! pr=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
                --jq '[.head.sha, (.draft|tostring), .user.login] | join("|")'); then
            warn "no verdict: could not re-read pull request #${PR_NUMBER} — a verdict must not be computed against a head it could not confirm."
            exit 0
          fi
          IFS='|' read -r head draft author_now <<<"$pr"
          if [ -z "${head:-}" ] || [ "$head" = "null" ]; then
            warn "no verdict: the re-read reported no head SHA."
            exit 0
          fi
          if [ "$head" != "$AWAITED_HEAD" ]; then
            say "SUPERSEDED — the branch moved from ${AWAITED_HEAD} to ${head} after the round was matched; the run for the new head owns the verdict."
            exit 0
          fi

          # The round's inline comments, counted. `--paginate` merges REST array pages into ONE
          # array (measured on this repository, gh 2.96.0), so `length` over the file is the whole
          # count; `arrays` refuses a non-array body, because an error object would otherwise count
          # its keys and read as findings — and `-e` turns that refusal into a non-zero exit.
          if ! gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews/${REVIEW_ID}/comments?per_page=100" \
                >"$RUNNER_TEMP/round-comments.json"; then
            warn "no verdict: could not read the round's inline comments — could not look is never nothing wrong."
            exit 0
          fi
          if ! findings=$(jq -e 'arrays | length' "$RUNNER_TEMP/round-comments.json"); then
            warn "no verdict: the round's comment listing did not parse as an array."
            exit 0
          fi
          # One integer and nothing else. If `--paginate` ever stops merging pages into one array,
          # `length` prints one figure per page, the numeric test below errors and evaluates false,
          # and a misparsed listing would read as a clean round — validate the corpus shape, never
          # the tool.
          case "$findings" in
            ''|*[!0-9]*)
              warn "no verdict: the comment count read as '$(printf '%s' "$findings" | tr '\n' ',')', not one integer — refusing to branch on a misparsed figure."
              exit 0
              ;;
          esac

          # The minter reads a key FILE, not a value — the same handling as librarian.yml, and
          # RUNNER_TEMP for the same reason: wiped with the runner, unreachable by any commit.
          key="$RUNNER_TEMP/app.pem"
          umask 077
          printf '%s\n' "$APP_KEY" >"$key"
          export PORTULAN_BOT_PRIVATE_KEY="$key"
          if ! token=$(node .portulan/tools/gh-bot-token.mjs); then
            warn "no verdict: could not mint an App installation token."
            exit 0
          fi

          # The sweep: every App approval naming a commit that is no longer the head is dismissed,
          # before any verdict branch, on every run that computes one. GITHUB_TOKEN reads; only the
          # App token acts. Byte-identical to the reviews read above — one program, two sites, one
          # set of fixtures.
          if ! reviews=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews" \
                --jq '.[] | [.user.login, .commit_id, .state, (.id|tostring)] | join("|")'); then
            warn "no verdict: could not read the reviews for the stale-approval sweep."
            exit 0
          fi
          approved_here=''
          while IFS='|' read -r login commit state id; do
            [ "$login" = 'portulan-agent[bot]' ] || continue
            [ "$state" = 'APPROVED' ] || continue
            if [ "$commit" = "$head" ]; then
              # The newest active approval on this head wins; there should only ever be one.
              approved_here="$id"
            elif GH_TOKEN="$token" gh api --silent -X PUT \
                  "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews/${id}/dismissals" \
                  -f message="Superseded: this derived verdict named ${commit}, and the head is now ${head}. Dismissed by the step that submitted it."; then
              say "dismissed a stale derived approval (review ${id}, named ${commit})."
            else
              warn "could not dismiss stale derived approval ${id} (named ${commit}) — an approval chip may be displayed that no round on the current head earned. Dismiss it by hand."
            fi
          done <<<"$reviews"

          if [ "$NOTES_STATE" = 'unread' ] || [ "$NOTES_STATE" = 'unparsable' ]; then
            # A chip from an earlier round may not outlive a round this step cannot read — the
            # same-head dismissal lives here as well as under the findings branch, because "no
            # verdict" and "the old verdict stands" are different sentences.
            if [ -n "$approved_here" ]; then
              if GH_TOKEN="$token" gh api --silent -X PUT \
                    "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews/${approved_here}/dismissals" \
                    -f message="Withdrawn: the newest round on ${head} carries a notes channel this step could not read, so no derived approval may stand on it."; then
                say "dismissed the derived approval on this head — the newest round's notes channel is ${NOTES_STATE}."
              else
                warn "could not dismiss the derived approval ${approved_here} on this head, though the newest round's notes channel is ${NOTES_STATE} — dismiss it by hand."
              fi
            fi
            warn "no verdict: the round's suppressed-notes channel is ${NOTES_STATE} — an approval computed over an unread channel would be a false green. Sweep /pulls/${PR_NUMBER}/reviews by hand."
            exit 0
          fi

          if [ "$findings" -gt 0 ]; then
            if [ -n "$approved_here" ]; then
              if GH_TOKEN="$token" gh api --silent -X PUT \
                    "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews/${approved_here}/dismissals" \
                    -f message="Withdrawn: the round on ${head} raised ${findings} inline comment(s) after this approval was derived."; then
                say "dismissed the derived approval on this head — the newest round raised findings."
              else
                warn "could not dismiss the derived approval ${approved_here} on this head, though the newest round raised findings — dismiss it by hand."
              fi
            fi
            say "no verdict: the round on ${head} raised ${findings} inline comment(s) — threads and conversation resolution carry them."
            exit 0
          fi

          if [ -n "$approved_here" ]; then
            say "verdict already displayed: review ${approved_here} approves ${head}. A re-run submits nothing twice."
            exit 0
          fi

          if [ "$NOTES_STATE" = 'present' ] && [ ! -s "${NOTES_FILE:-/nonexistent}" ]; then
            warn "no verdict: the notes were reported present and their file is missing or empty — refusing to approve over notes this step cannot quote."
            exit 0
          fi

          # The body composes fixed sentences, derived values, and Copilot's own quoted notes — no
          # free prose at run time, the same discipline that makes the librarian safe to file on a
          # cron.
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [ "$NOTES_STATE" = 'present' ]; then
            body="**Derived verdict: approve, with Copilot's suggestions attached.**"$'\n\n'
            body="${body}Copilot's round on \`${head}\` raised no inline comment. Its ${NOTES_COUNT} suppressed low-confidence note(s) are quoted below: they carry no thread and no gate, and this approval is not their disposal — each still owes an address-or-refuse reply under the standing feedback-loop rule, in ONE batched pull-request comment. That is the exception a note earns by having no thread to sit on; an inline comment is answered on its own thread, never folded into a summary."$'\n\n'
            body="${body}$(cat "$NOTES_FILE")"$'\n\n'
          else
            body="**Derived verdict: approve.**"$'\n\n'
            body="${body}Copilot's round on \`${head}\` raised no inline comment and no suppressed low-confidence note."$'\n\n'
          fi
          body="${body}Computed from that round by [\`copilot-review.yml\`](${run_url}) and submitted by the agent identity — derived, never judged. The merge gate is unchanged: the maintainer decides."

          if GH_TOKEN="$token" gh api --silent -X POST \
                "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews" \
                -f commit_id="$head" -f event=APPROVE -f body="$body"; then
            say "APPROVED — derived from Copilot's round on ${head} (${NOTES_COUNT:-0} suppressed note(s); submitted as the agent identity)."
          else
            warn "the verdict could not be submitted — no approval is displayed, and the check above is unaffected. Re-run this job to retry."
            exit 0
          fi
