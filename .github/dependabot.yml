# Dependabot bumps the SHA-pinned Actions, rewriting each SHA with its trailing `# vX.Y.Z` comment.

version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    # Silence is not evidence: only Insights → Dependency graph → Dependabot shows when it last checked.
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Bucharest

    groups:
      actions:
        patterns:
          - "*"

    open-pull-requests-limit: 1
